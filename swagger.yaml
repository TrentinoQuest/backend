          type: string
        status:
          type: string
          enum: [active, redeemed, expired]
        expiresAt:
          type: string
          format: date-time
        offerTitle:
          type: string
        businessName:
          type: string
        redeemedAt:
          type: string
          format: date-time
          nullable: true

  responses:
    Unauthorized:
      description: Token JWT mancante o non valido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: L'utente non ha i permessi per questa operazione.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Risorsa non trovata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Input non valido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflitto con lo stato corrente della risorsa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: |
        Il payload e' sintatticamente valido ma rifiutato dalle regole
        di business (es. metadati GPS oltre soglia di accettazione).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Registra un nuovo Giocatore
      description: |
        Crea un nuovo account di tipo Giocatore.
        L'endpoint NON richiede autenticazione preventiva.
        In caso di successo restituisce la coppia access+refresh token pronta
        per l'uso, cosi' che il client possa procedere senza una chiamata di
        login separata.
        La registrazione di Amministratori e Attivita Locali avviene tramite
        flussi separati e non e' esposta da questo endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPlayerRequest'
      responses:
        '201':
          description: Giocatore registrato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email o username gia' in uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags: [auth]
      summary: Autentica un utente esistente
      description: |
        Verifica le credenziali fornite e, in caso di successo, restituisce
        una coppia access+refresh token. L'access token va inviato come
        "Bearer <token>" nell'header Authorization delle richieste successive.
        Il refresh token va conservato in storage persistente sul client e
        usato solo verso /auth/refresh per rinnovare l'access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticazione riuscita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenziali non valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rinnova la coppia di token
      description: |
        Riceve il refresh token corrente e, se valido, emette una nuova
        coppia access+refresh token. Il refresh token vecchio viene revocato
        (rotation): ogni refresh token e' utilizzabile una sola volta.
        Risponde 401 se il refresh token e' assente, sconosciuto, scaduto
        o gia' revocato. In tal caso il client deve scartare entrambi i
        token e procedere con un nuovo login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Nuova coppia di token emessa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token non valido, scaduto o revocato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags: [auth]
      summary: Termina la sessione corrente
      description: |
        Revoca il refresh token specificato impedendone ulteriori utilizzi.
        L'access token resta tecnicamente valido fino alla sua scadenza
        naturale (15 minuti), ma senza refresh token attivo l'utente non
        puo' rinnovarlo: la sessione termina di fatto entro la finestra
        dell'access token corrente.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logout completato
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/password-recovery:
    post:
      tags: [auth]
      summary: Richiede il recupero della password
      description: |
        Genera un token monouso di recupero password e invia all'utente
        un link via email per impostarne una nuova.
        Per motivi di sicurezza la risposta e' sempre 202, indipendentemente
        dall'esistenza dell'email nel sistema, per non rivelare quali email
        sono registrate.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
      responses:
        '202':
          description: |
            Richiesta accettata. Se l'email e' registrata, l'utente ricevera'
            un link di recupero.
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/oauth/google:
    post:
      tags: [auth]
      summary: Login/registrazione tramite Google OAuth
      description: |
        Il client mobile ottiene un idToken da Google SDK (Capacitor) e lo invia
        al backend. Il backend verifica il token, crea o recupera il Player,
        e restituisce la coppia access+refresh token.
        In sviluppo locale con SKIP_OAUTH_VERIFICATION=true si può usare un
        JWT firmato con qualsiasi segreto purché contenga email e sub.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: ID token ottenuto da Google SDK
      responses:
        '200':
          description: Login/registrazione riuscita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Token non valido o GOOGLE_CLIENT_ID non configurato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /quests:
    get:
      tags: [quest-completion]
      summary: Lista delle quest visibili
      description: |
        Restituisce l'elenco delle quest attive. Supporta filtri opzionali
        per posizione (bounding box) e per tipo. Usato dal client mobile
        per popolare la mappa.
      parameters:
        - name: lat
          in: query
          schema: { type: number }
          description: Latitudine del centro per filtro geografico
        - name: lng
          in: query
          schema: { type: number }
          description: Longitudine del centro per filtro geografico
        - name: radiusMeters
          in: query
          schema: { type: integer, minimum: 100, maximum: 50000 }
          description: Raggio in metri dal centro per filtro geografico
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/QuestType'
          description: Filtra solo quest principali o solo secondarie
      responses:
        '200':
          description: Lista delle quest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnyQuest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /quests/{id}:
    get:
      tags: [quest-completion]
      summary: Dettagli di una quest
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dettagli della quest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyQuest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /quests/{id}/check-in:
    post:
      tags: [quest-completion]
      summary: Completa una quest secondaria con check-in geolocalizzato
      description: |
        Verifica che il giocatore si trovi entro il raggio di check-in della
        quest specificata e registra il completamento. Risponde con i punti
        assegnati e la distanza GPS dal target.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '201':
          description: Check-in completato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Quest gia' completata o fuori raggio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Fix GPS rifiutato dalla validazione anti-cheat (richiede fix nel body).
            Codici code possibili:
              - OUT_OF_RANGE_ACCURACY: accuracy oltre la soglia configurata
              - STALE_FIX: fix troppo vecchio rispetto alla soglia configurata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quests/{id}/scan:
    post:
      tags: [quest-completion]
      summary: Completa una quest principale tramite scansione QR
      description: |
        Verifica il token del QR code scansionato e la posizione GPS del
        giocatore. Se entrambi validi, registra il completamento, assegna
        punti e sblocca il collezionabile associato.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanQrRequest'
      responses:
        '201':
          description: Scansione completata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanQrResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Quest gia' completata, token non valido o fuori raggio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Fix GPS rifiutato dalla validazione anti-cheat (richiede fix nel body).
            Codici code possibili:
              - OUT_OF_RANGE_ACCURACY: accuracy oltre la soglia configurata
              - STALE_FIX: fix troppo vecchio rispetto alla soglia configurata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quests/{id}/proximity:
    get:
      tags: [quest-completion]
      summary: Feedback di prossimità al QR
      description: |
        Restituisce una zona categorica che indica quanto il giocatore è vicino
        al QR fisico della quest, senza mai rivelare coordinate esatte o distanza
        in metri. Utilizzato per il radar di ricerca.
        Solo per quest di tipo primary attive.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
          description: Latitudine del giocatore
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
          description: Longitudine del giocatore
      responses:
        '200':
          description: Zona di prossimità calcolata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProximityResponse'
        '400':
          description: Quest non è di tipo primary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Quest non trovata o non attiva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /player/me:
    get:
      tags: [player-profile]
      summary: Profilo del giocatore autenticato
      responses:
        '200':
          description: Profilo del giocatore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /player/completions:
    get:
      tags: [player-profile]
      summary: Feed dei completamenti del giocatore
      description: |
        Restituisce i completamenti effettuati dal giocatore in ordine
        cronologico decrescente, con i dati della quest associata.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Lista dei completamenti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompletionEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /player/collection:
    get:
      tags: [player-profile]
      summary: Album dei collezionabili del giocatore
      responses:
        '200':
          description: Lista dei collezionabili sbloccati
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectibleEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /player/progress:
    get:
      tags: [player-profile]
      summary: Progressi del giocatore
      description: |
        Restituisce un riepilogo dei progressi del giocatore sull'intero
        territorio o su una zona specifica.
      parameters:
        - name: zone
          in: query
          schema: { type: string }
          description: Identificativo zona (se omesso, restituisce il totale regione)
      responses:
        '200':
          description: Riepilogo progressi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/quests:
    get:
      tags: [quest-admin]
      summary: Lista paginata delle quest (admin)
      description: |
        Restituisce l'elenco completo delle quest indipendentemente dallo
        status (active, inactive, archived). Supporta filtri per tipo e
        status e paginazione offset/limit.
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/QuestType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/QuestStatus'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Lista paginata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAdminQuestsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [quest-admin]
      summary: Crea una nuova quest
      description: |
        Crea una quest secondaria o principale in base al campo type del
        payload. Le quest principali create non hanno ancora exactPosition,
        qrToken e validationRadiusMeters: questi vengono popolati
        dall'operatore al momento del piazzamento fisico del QR code.
        Lo status iniziale e' INACTIVE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestRequest'
      responses:
        '201':
          description: Quest creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyQuest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Collezionabile referenziato non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/quests/{id}:
    get:
      tags: [quest-admin]
      summary: Dettaglio quest per admin
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dettaglio quest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyQuest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [quest-admin]
      summary: Aggiorna una quest
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestRequest'
      responses:
        '200':
          description: Quest aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyQuest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [quest-admin]
      summary: Archivia una quest (soft delete)
      description: |
        Lo status della quest viene impostato a ARCHIVED. La quest non
        viene rimossa dal database per preservare l'integrita' dei
        completamenti gia' fatti dai giocatori.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Quest archiviata
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/quests/{id}/activate:
    post:
      tags: [quest-admin]
      summary: Attiva una quest
      description: |
        Imposta lo status della quest a ACTIVE. Per le quest principali
        e' richiesto che exactPosition e qrToken siano gia' popolati
        (cioe' che l'operatore abbia gia' piazzato fisicamente il QR) e
        che il QR non sia in stato reported.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Quest attivata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyQuest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Quest non ancora piazzata, QR segnalato o stato non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/quests/{id}/deactivate:
    post:
      tags: [quest-admin]
      summary: Disattiva una quest
      description: |
        Imposta lo status della quest a INACTIVE. La quest non sara'
        piu' visibile ai giocatori ma resta nel sistema e puo' essere
        riattivata.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Quest disattivata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyQuest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/collectibles:
    get:
      tags: [quest-admin]
      summary: Lista collezionabili attivi (admin)
      description: |
        Restituisce la lista dei collezionabili attivi. Usato dal
        backoffice per popolare il dropdown nella creazione/modifica di
        una quest principale. I collezionabili archiviati sono esclusi.
      responses:
        '200':
          description: Lista collezionabili
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collectible'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [quest-admin]
      summary: Crea un nuovo collezionabile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectibleRequest'
      responses:
        '201':
          description: Collezionabile creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectible'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/collectibles/{id}:
    get:
      tags: [quest-admin]
      summary: Dettaglio collezionabile (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dettaglio collezionabile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectible'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [quest-admin]
      summary: Aggiorna un collezionabile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectibleRequest'
      responses:
        '200':
          description: Collezionabile aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectible'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [quest-admin]
      summary: Archivia un collezionabile (soft delete)
      description: |
        Il collezionabile viene archiviato (status archived), non rimosso,
        per preservare gli album dei giocatori che lo possiedono.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Collezionabile archiviato
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /operator/quests:
    get:
      tags: [operator-ops]
      summary: Lista quest principali per l'operatore
      description: |
        Lista paginata delle quest principali filtrabile per stato di
        piazzamento. Usata dall'operatore per organizzare il lavoro:
        quest da piazzare (pending), gia' piazzate (placed), segnalate
        come danneggiate (reported). RF42/43/45 del D1.
      parameters:
        - name: placementStatus
          in: query
          schema:
            $ref: '#/components/schemas/PlacementStatus'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Lista paginata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOperatorQuestsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /operator/quests/{id}:
    get:
      tags: [operator-ops]
      summary: Dettaglio quest principale per l'operatore
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dettaglio quest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorQuestView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /operator/quests/{id}/place:
    post:
      tags: [operator-ops]
      summary: Piazza fisicamente il QR code
      description: |
        L'operatore registra la posizione GPS esatta del QR appena
        piazzato. Il backend genera il qrToken e imposta placementStatus
        a placed. RF40 del D1. Se viene fornito il fix GPS, viene
        validato (anti-cheat) e puo' rispondere 422.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceQuestRequest'
      responses:
        '200':
          description: QR piazzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorQuestView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: QR gia' piazzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Fix GPS rifiutato (accuracy o eta' fuori soglia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /operator/quests/{id}/position:
    patch:
      tags: [operator-ops]
      summary: Aggiorna la posizione di un QR gia' piazzato
      description: RF41 del D1. Richiede che la quest sia gia' in stato placed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestPositionRequest'
      responses:
        '200':
          description: Posizione aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorQuestView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: QR non piazzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Fix GPS rifiutato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /operator/quests/{id}/report-issue:
    post:
      tags: [operator-ops]
      summary: Segnala un QR mancante o danneggiato
      description: |
        RF44 del D1. Porta placementStatus a reported e disattiva la
        quest (status inactive) cosi' che non sia completabile finche'
        il QR non viene ripristinato.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportQuestIssueRequest'
      responses:
        '200':
          description: Segnalazione registrata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorQuestView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /business/register:
    post:
      tags: [business-self-mgt]
      summary: Registra una nuova Attivita Locale
      description: |
        Crea un account business in stato pending e restituisce subito la
        coppia di token. L'attivita puo' autenticarsi ma non puo' pubblicare
        offerte finche' l'admin non approva l'affiliazione (RF28).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBusinessRequest'
      responses:
        '201':
          description: Attivita registrata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email gia' in uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /business/me:
    get:
      tags: [business-self-mgt]
      summary: Profilo dell'attivita autenticata
      responses:
        '200':
          description: Profilo attivita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [business-self-mgt]
      summary: Aggiorna il profilo aziendale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessProfileRequest'
      responses:
        '200':
          description: Profilo aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /business/offers:
    get:
      tags: [business-self-mgt]
      summary: Lista le offerte dell'attivita autenticata
      responses:
        '200':
          description: Lista offerte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [business-self-mgt]
      summary: Crea una nuova offerta
      description: |
        Disponibile solo per attivita approvate (RF29). Un'attivita pending
        o rejected riceve 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfferRequest'
      responses:
        '201':
          description: Offerta creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Affiliazione non approvata o ruolo non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /business/offers/{id}:
    patch:
      tags: [business-self-mgt]
      summary: Aggiorna una propria offerta
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOfferRequest'
      responses:
        '200':
          description: Offerta aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Offerta di altra attivita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [business-self-mgt]
      summary: Archivia una propria offerta (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Offerta archiviata
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Offerta di altra attivita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/businesses:
    get:
      tags: [business-admin]
      summary: Lista le affiliazioni (admin)
      description: Lista paginata delle attivita, filtrabile per stato (RF38).
      parameters:
        - name: approvalStatus
          in: query
          schema:
            $ref: '#/components/schemas/BusinessApprovalStatus'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Lista paginata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBusinessesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/businesses/{id}/approve:
    post:
      tags: [business-admin]
      summary: Approva l'affiliazione di un'attivita
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Attivita approvata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Attivita gia approvata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/businesses/{id}/reject:
    post:
      tags: [business-admin]
      summary: Rifiuta l'affiliazione di un'attivita
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectBusinessRequest'
      responses:
        '200':
          description: Attivita rifiutata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /offers:
    get:
      tags: [business-self-mgt]
      summary: Lista le offerte pubbliche (lato giocatore)
      description: |
        Restituisce le offerte attive delle sole attivita approvate,
        arricchite con i dati dell'attivita. Visibile a tutti gli utenti
        autenticati.
      responses:
        '200':
          description: Lista offerte pubbliche
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferWithBusiness'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/analytics/summary:
    get:
      tags: [analytics]
      summary: Riepilogo contatori globali (admin)
      description: |
        Restituisce i contatori globali del sistema per la dashboard
        di benvenuto dell'admin: utenti, quest attive, completamenti,
        attivita affiliate, collezionabili, quest pending.
      responses:
        '200':
          description: Contatori globali
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/analytics/completions-over-time:
    get:
      tags: [analytics]
      summary: Serie temporale dei completamenti (admin)
      description: |
        Aggregazione dei completamenti per giorno/settimana/mese
        nell'intervallo richiesto. Default: ultimi 30 giorni,
        granularita' day. Include anche completamenti di quest archiviate
        (un completamento e' un evento storico avvenuto). Risponde al
        requisito RF39 di stagionalita'.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Inizio intervallo in formato YYYY-MM-DD (default 30 giorni prima di "to")
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Fine intervallo in formato YYYY-MM-DD (default oggi)
        - name: granularity
          in: query
          schema:
            $ref: '#/components/schemas/AnalyticsGranularity'
          description: Granularita' di aggregazione (default day)
      responses:
        '200':
          description: Serie temporale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionsOverTimeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/analytics/top-quests:
    get:
      tags: [analytics]
      summary: Quest piu' completate (admin)
      description: |
        Top N quest per numero di completamenti, in ordine decrescente.
        Include anche completamenti di quest archiviate. Default limit 10.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Top quest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopQuestEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/analytics/never-completed-quests:
    get:
      tags: [analytics]
      summary: Quest attive mai completate (admin)
      description: |
        Lista delle quest in stato active per cui non esiste alcun
        completamento. Segnala zone potenzialmente "ignorate" dai
        giocatori (RF39). Non considera quest inactive o archived.
      responses:
        '200':
          description: Quest mai completate
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NeverCompletedQuestEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/analytics/completions-heatmap:
    get:
      tags: [analytics]
      summary: Heatmap dei completamenti (admin)
      description: |
        Punti GPS dei completamenti nell'intervallo richiesto, per
        renderizzare una heatmap dei flussi turistici. Default: ultimi
        90 giorni. Le coordinate sono quelle del giocatore al momento
        del completamento (non quelle della quest), cosi' la heatmap
        riflette il transito effettivo sul territorio.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Inizio intervallo in formato YYYY-MM-DD (default 90 giorni fa)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Fine intervallo in formato YYYY-MM-DD (default oggi)
      responses:
        '200':
          description: Punti heatmap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionsHeatmapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/analytics/leaderboard:
    get:
      tags: [analytics]
      summary: Classifica giocatori per punti (admin)
      description: |
        Top N giocatori ordinati per totalPoints decrescente.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Top giocatori
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── Modulo 1 — Device Token ────────────────────────────────────────────────
  /auth/device-token:
    post:
      tags: [auth]
      summary: Salva il device token FCM per le notifiche push
      description: |
        Registra o aggiorna il token FCM del dispositivo del player autenticato.
        Idempotente: chiamate successive sovrascrivono il token precedente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcmToken]
              properties:
                fcmToken:
                  type: string
                  description: Token Firebase Cloud Messaging del dispositivo
      responses:
        '204':
          description: Token salvato
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Modulo 2 — Onboarding ─────────────────────────────────────────────────
  /onboarding/complete:
    post:
      tags: [player-profile]
      summary: Completa l'onboarding e assegna i premi iniziali
      description: |
        Segna l'onboarding come completato e assegna +100 XP e +50 monete
        (l'Amuleto del Viandante). Idempotente: se gia completato risponde
        200 senza riassegnare premi.
      responses:
        '200':
          description: Onboarding completato (o gia completato in precedenza)
          content:
            application/json:
              schema:
                type: object
                required: [onboardingCompleted, alreadyCompleted]
                properties:
                  onboardingCompleted:
                    type: boolean
                  alreadyCompleted:
                    type: boolean
                  xpAwarded:
                    type: integer
                  coinsAwarded:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Modulo 4 — Valley Progress ────────────────────────────────────────────
  /player/valley-progress:
    get:
      tags: [player-profile]
      summary: Progressione per valle (Fog of War)
      description: |
        Restituisce la percentuale di quest completate dal player per ciascuna
        delle 10 valli del Trentino. Usato per il layer "Fog of War" sulla mappa.
      responses:
        '200':
          description: Progressione per valle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValleyProgressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Modulo 5 — Daily Quests ───────────────────────────────────────────────
  /player/daily-quests:
    get:
      tags: [daily-quests]
      summary: Missioni giornaliere del player
      description: |
        Restituisce le 3 missioni del giorno per il contesto specificato.
        Se non ancora generate per oggi, vengono create al momento (lazy).
      parameters:
        - name: context
          in: query
          required: true
          schema:
            type: string
            enum: [in_trentino, out_of_region]
          description: Contesto geografico del giocatore
      responses:
        '200':
          description: Missioni del giorno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyQuestsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /player/daily-quests/{type}/complete:
    post:
      tags: [daily-quests]
      summary: Completa una missione giornaliera
      description: |
        Segna la missione come completata e assegna XP e monete.
        Idempotente: se gia completata risponde 200 senza riassegnare premi.
        Restituisce 404 se il tipo non fa parte delle missioni del giorno.
      parameters:
        - name: type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DailyQuestType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Missione completata (o gia completata)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteDailyQuestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Tipo non presente nelle missioni odierne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Modulo 6 — Lore Quiz ──────────────────────────────────────────────────
  /lore/daily-question:
    get:
      tags: [lore]
      summary: Domanda della lore del giorno
      description: |
        Restituisce la domanda del giorno (deterministica: tutti i player
        vedono la stessa domanda nello stesso giorno). Non include il campo
        correctOptionIndex nella risposta. Se il player ha gia risposto,
        include alreadyAnswered: true e il risultato.
      responses:
        '200':
          description: Domanda del giorno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoreQuestionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Nessuna domanda disponibile nel sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /lore/answer:
    post:
      tags: [lore]
      summary: Rispondi alla domanda della lore
      description: |
        Invia la risposta alla domanda del giorno. Un solo tentativo al giorno.
        Risposta corretta: assegna 50 monete e genera un Map Fragment.
        Risposta errata: nessun premio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionIndex]
              properties:
                optionIndex:
                  type: integer
                  minimum: 0
                  maximum: 3
      responses:
        '200':
          description: Risposta registrata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoreAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Risposta gia inviata oggi (ALREADY_ANSWERED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Modulo 7 — Leghe ─────────────────────────────────────────────────────
  /leagues/current:
    get:
      tags: [leagues]
      summary: Lega corrente del player
      description: |
        Restituisce la stagione corrente, il tier, il girone e la classifica
        completa dei 30 giocatori del girone ordinata per weeklyXp.
      responses:
        '200':
          description: Lega corrente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueCurrentView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Nessuna stagione attiva o membership non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /leagues/history:
    get:
      tags: [leagues]
      summary: Storico stagioni del player
      description: Ultime 10 stagioni del player con tier, rank finale, promoted/relegated.
      responses:
        '200':
          description: Storico stagioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeagueHistoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Modulo 8 — Kudos ─────────────────────────────────────────────────────
  /social/kudos:
    post:
      tags: [social]
      summary: Invia un kudos a un altro player
      description: |
        Invia un kudos su un'attivita specifica (completamento o sblocco
        collezionabile). Un solo kudos per attivita per player.
        Manda notifica push al destinatario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KudosRequest'
      responses:
        '201':
          description: Kudos inviato
        '400':
          description: |
            Input non valido o auto-kudos (SELF_KUDOS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Kudos gia inviato per questa attivita (KUDOS_ALREADY_SENT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Modulo 9 — Social Feed ────────────────────────────────────────────────
  /social/feed:
    get:
      tags: [social]
      summary: Feed delle attivita degli amici
      description: |
        Restituisce gli ultimi completamenti e sblocchi collezionabili degli
        amici (status accepted). Paginato. Per ogni item include kudosCount
        e se il player autenticato ha gia inviato kudos.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Feed attivita
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedActivityItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /social/leaderboard:
    get:
      tags: [social]
      summary: Classifica tra amici
      description: |
        Restituisce la classifica del player corrente e dei suoi amici (accepted).
        socialScore = completamenti_primary × 2 + completamenti_secondary × 1.
        Ordinata per socialScore decrescente.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Classifica sociale
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialLeaderboardEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /social/friends:
    get:
      tags: [social]
      summary: Lista amici
      description: Amicizie in stato accepted del player autenticato.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista amici
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [friendshipId, playerId, username]
                  properties:
                    friendshipId: { type: string }
                    playerId: { type: string }
                    username: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /social/friends/request:
    post:
      tags: [social]
      summary: Invia richiesta di amicizia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId]
              properties:
                recipientId: { type: string }
      responses:
        '201':
          description: Richiesta inviata
        '400':
          description: Auto-amicizia o errore validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Amicizia già esistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /social/friends/requests:
    get:
      tags: [social]
      summary: Richieste di amicizia ricevute
      description: Richieste pending ricevute dal player autenticato.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Richieste pending
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [friendshipId, requesterId, username, createdAt]
                  properties:
                    friendshipId: { type: string }
                    requesterId: { type: string }
                    username: { type: string }
                    createdAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /social/friends/{id}/accept:
    post:
      tags: [social]
      summary: Accetta richiesta di amicizia
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: ID del documento Friendship
      responses:
        '200':
          description: Amicizia accettata
        '403':
          description: Non sei il destinatario della richiesta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Richiesta non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /social/friends/{id}/reject:
    post:
      tags: [social]
      summary: Rifiuta richiesta di amicizia
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: ID del documento Friendship
      responses:
        '200':
          description: Richiesta rifiutata
        '403':
          description: Non sei il destinatario della richiesta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Richiesta non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /social/friends/{id}:
    delete:
      tags: [social]
      summary: Rimuovi amico
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: ID del documento Friendship
      responses:
        '200':
          description: Amico rimosso
        '404':
          description: Amicizia non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Modulo 10 — Coop ─────────────────────────────────────────────────────
  /coop/challenges:
    post:
      tags: [coop]
      summary: Crea una sfida cooperativa
      description: |
        Crea una nuova sfida cooperativa tra il player autenticato e un amico.
        Il partner deve essere in friendships con status accepted.
        Manda notifica push al partner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoopChallengeRequest'
      responses:
        '201':
          description: Sfida creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoopChallengeView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Il partner non e amico del player (NOT_FRIENDS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [coop]
      summary: Lista sfide attive del player
      description: Restituisce le sfide attive in cui il player e initiator o partner.
      responses:
        '200':
          description: Lista sfide attive
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoopChallengeView'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /coop/challenges/{id}:
    get:
      tags: [coop]
      summary: Dettaglio sfida cooperativa
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dettaglio sfida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoopChallengeView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Il player non e partecipante della sfida (NOT_PARTICIPANT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /coop/challenges/{id}/progress:
    post:
      tags: [coop]
      summary: Aggiunge progresso alla sfida
      description: |
        Incrementa il contributo del player chiamante (initiator o partner).
        Se totalProgress >= targetValue, la sfida viene segnata come completata
        e il collezionabile esclusivo viene assegnato a entrambi.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProgressRequest'
      responses:
        '200':
          description: Progresso aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoopChallengeView'
        '400':
          description: Sfida non attiva (CHALLENGE_NOT_ACTIVE) o input non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Il player non e partecipante (NOT_PARTICIPANT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /coop/nudge/{partnerId}:
    post:
      tags: [coop]
      summary: Manda un nudge al partner
      description: |
        Invia una notifica push di stimolo al partner. Rate limit: un nudge
        ogni 24 ore verso lo stesso partner. Richiede amicizia accepted.
      parameters:
        - name: partnerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '204':
          description: Nudge inviato
        '400':
          description: Rate limit (NUDGE_RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Non sono amici (NOT_FRIENDS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Modulo 11 — Mercato Coupon ────────────────────────────────────────────
  /market/offers:
    get:
      tags: [market]
      summary: Lista offerte disponibili nel mercato coupon
      description: |
        Lista offerte attive delle attivita approvate, arricchite con i dati
        aziendali e il campo remaining (null = illimitato).
      responses:
        '200':
          description: Lista offerte con campo remaining
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferWithRemaining'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /market/purchase/{offerId}:
    post:
      tags: [market]
      summary: Acquista un coupon
      description: |
        Scala le monete del player e crea un coupon con token UUID e scadenza
        48 ore. Operazione atomica: se il player non ha abbastanza monete
        o l'offerta e esaurita, nessuna modifica avviene.
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Coupon creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponView'
        '400':
          description: Monete insufficienti (INSUFFICIENT_COINS) o input non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Offerta non trovata (OFFER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Offerta esaurita (OFFER_SOLD_OUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /market/my-coupons:
    get:
      tags: [market]
      summary: Coupon del player
      description: |
        Lista dei coupon del player (attivi, scaduti, usati). I coupon con
        expiresAt < now vengono automaticamente marcati expired.
      responses:
        '200':
          description: Lista coupon
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CouponView'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /market/redeem/{token}:
    get:
      tags: [market]
      summary: Verifica coupon (endpoint pubblico esercente)
      description: |
        Restituisce le info del coupon senza richiedere autenticazione JWT.
        Usato dall'esercente per verificare il coupon prima di riscattarlo.
        Sicurezza tramite opacita del token (UUID v4, 122 bit di entropia).
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Info coupon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponRedeemInfo'
        '404':
          description: Token non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [market]
      summary: Riscatta coupon (endpoint pubblico esercente)
      description: |
        Segna il coupon come redeemed. Non richiede autenticazione JWT.
        Risponde 409 se il coupon e gia stato usato o e scaduto.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Coupon riscattato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponRedeemInfo'
        '404':
          description: Token non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Coupon gia usato (COUPON_ALREADY_REDEEMED) o scaduto (COUPON_EXPIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
