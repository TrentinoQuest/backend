openapi: 3.0.3
info:
  title: Trentino Quest API
  description: |
    REST API di Trentino Quest, app gamificata per l'esplorazione del Trentino.
    Questa specifica e' il contratto pubblico esposto dal backend Node.js verso
    i client (mobile-app Ionic/Angular e backoffice Angular) ed e' organizzata
    secondo le interfacce dei componenti definiti nel Deliverable D2.

    Stile architetturale REST (Fielding 2000):
    - Addressability: URI resource-oriented sotto /api/v1/
    - Uniform Interface: verbi HTTP standard con semantica idempotente
    - Connectedness: campi _links nelle response per hypermedia
    - Statelessness: autenticazione JWT, nessuna sessione lato server

    Mapping interfacce D2 -> tag OpenAPI:
    - IAuth                -> auth
    - IPlayerProfile       -> player-profile
    - IQuestCompletion     -> quest-completion
    - IQuestAdmin          -> quest-admin
    - IOperatorOps         -> operator-ops
    - IQrValidation        -> qr-validation
    - IBusinessSelfMgt     -> business-self-mgt
    - IBusinessAdmin       -> business-admin
    - ISocial              -> social
    - IAnalytics           -> analytics

    Pattern di autenticazione: access token + refresh token.
    L'access token (JWT, TTL 15 minuti) viene allegato a tutte le richieste
    autenticate nell'header Authorization. Il refresh token (stringa opaque,
    TTL 30 giorni) e' usato solo verso /auth/refresh per rinnovare l'access
    token. La rotation dei refresh token e' attiva: ogni chiamata a
    /auth/refresh emette un nuovo refresh token e revoca quello precedente.
  version: 0.9.0
  contact:
    name: Gruppo 19 - Trentino Quest
servers:
  - url: http://localhost:3000/api/v1
    description: Sviluppo locale
tags:
  - name: auth
    description: |
      Interfaccia IAuth fornita da AuthService.
      Login, registrazione, logout, recovery password, verifica del ruolo utente.
  - name: player-profile
    description: |
      Interfaccia IPlayerProfile fornita da QuestService.
      Profilo del giocatore, collezionabili, punti, QR code personale.
  - name: quest-completion
    description: |
      Interfaccia IQuestCompletion fornita da QuestService.
      Visualizzazione mappa, dettagli quest, scansione QR con validazione GPS,
      check-in geolocalizzato per quest secondarie.
  - name: quest-admin
    description: |
      Interfaccia IQuestAdmin fornita da QuestService.
      Creazione, modifica, disattivazione delle quest. Generazione e gestione
      dei QR code. Pianificazione del piazzamento delle quest principali.
  - name: operator-ops
    description: |
      Interfaccia IOperatorOps fornita da QuestService.
      Registrazione posizione GPS dei QR code piazzati, aggiornamento coordinate,
      segnalazione QR code mancanti o danneggiati.
  - name: qr-validation
    description: |
      Interfaccia IQrValidation fornita da QuestService.
      Validazione del QR code personale del giocatore presso un'Attivita Locale
      per l'applicazione di uno sconto.
  - name: business-self-mgt
    description: |
      Interfaccia IBusinessSelfMgt fornita da BusinessService.
      Registrazione dell'Attivita Locale, gestione del profilo aziendale,
      CRUD delle proprie offerte.
  - name: business-admin
    description: |
      Interfaccia IBusinessAdmin fornita da BusinessService.
      Visualizzazione, approvazione e rifiuto delle richieste di affiliazione
      delle Attivita Locali.
  - name: social
    description: |
      Interfaccia ISocial fornita da SocialService.
      Gestione amicizie, classifiche social, feed di attivita.
  - name: analytics
    description: |
      Interfaccia IAnalytics fornita da AnalyticsService.
      Dashboard analitica per amministratori: flussi turistici, zone visitate,
      stagionalita, statistiche aggregate.
  - name: daily-quests
    description: |
      Missioni giornaliere del giocatore. Ogni giorno vengono assegnate 3 missioni
      casuali dal pool (in_trentino o out_of_region). Generazione lazy al primo
      accesso della giornata.
  - name: lore
    description: |
      Quiz della Lore: una domanda al giorno su storia, cultura e natura del
      Trentino. La risposta corretta assegna monete e genera un Map Fragment.
  - name: leagues
    description: |
      Leghe competitive settimanali. I giocatori sono raggruppati in gironi
      da 30 per tier (Porfido, Marmo, Arenaria, Granito, Dolomiti). Il reset
      avviene ogni lunedi.
  - name: coop
    description: |
      Sfide cooperative tra coppie di amici. L'initiator propone una sfida
      con scadenza 7 giorni; entrambi i partecipanti contribuiscono al progresso.
  - name: market
    description: |
      Mercato coupon: i giocatori spendono monete per acquistare offerte dalle
      Attivita Locali approvate. I coupon hanno vita di 48 ore.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT ottenuto via POST /auth/login. Inviato in ogni
        richiesta protetta nell'header Authorization come "Bearer <token>".
        Vita breve (15 minuti) per limitare il rischio in caso di intercettazione.
        Il rinnovo avviene tramite POST /auth/refresh usando il refresh token.
  schemas:
    Links:
      type: object
      description: Hyperlinks ad altre risorse correlate (connectedness REST).
      additionalProperties:
        type: object
        properties:
          href:
            type: string
            format: uri
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: QUEST_ALREADY_COMPLETED
        message:
          type: string
        details:
          type: object
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
    GeoFix:
      description: |
        Misurazione GPS con metadati di qualita'. Estende GeoPoint con
        accuracy e clientTimestamp, necessari alla validazione anti-cheat
        lato server nei payload di check-in (UC-30) e scansione QR (UC-22).
      allOf:
        - $ref: '#/components/schemas/GeoPoint'
        - type: object
          required: [accuracy, clientTimestamp]
          properties:
            accuracy:
              type: number
              format: double
              minimum: 0
              exclusiveMinimum: true
              maximum: 100000
              description: |
                Raggio di incertezza orizzontale in metri (1 sigma, 68% di
                confidenza). Valori tipici: 5-20m outdoor, 50-200m indoor.
            clientTimestamp:
              type: integer
              format: int64
              minimum: 1
              description: |
                Timestamp di acquisizione del fix sul client, in millisecondi
                dall'epoch Unix (compatibile con Date.now()). Il backend lo
                confronta con il proprio orologio per rifiutare fix obsoleti.
    PaginatedMeta:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    UserRole:
      type: string
      enum: [player, admin, business, maintenance]
      description: |
        Ruolo dell'utente nel sistema. Mappa la gerarchia di Utente del D2:
        - player: Giocatore
        - admin: Amministratore
        - business: Attivita Locale (riservato, attivato dal modulo business)
        - maintenance: Operatore Manutenzione (riservato, attivato dal modulo quests)
    User:
      type: object
      description: |
        Rappresentazione di base di un utente. I campi specifici del ruolo
        vengono aggiunti tramite gli schemi Player e Admin.
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
          example: 65f9a1b2c3d4e5f6a7b8c9d0
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
        _links:
          $ref: '#/components/schemas/Links'
    Player:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [username, totalPoints, registrationDate, xp, level, levelTitle, currentStreak, longestStreak, streakShieldActive, xpToNextLevel]
          properties:
            username:
              type: string
              minLength: 3
              maxLength: 30
            totalPoints:
              type: integer
              minimum: 0
            registrationDate:
              type: string
              format: date-time
            xp:
              type: integer
              minimum: 0
              description: XP totali accumulati (non si spendono mai)
            level:
              type: integer
              minimum: 1
              maximum: 10
              description: Livello corrente derivato dagli XP
            levelTitle:
              type: string
              description: Titolo del livello corrente (es. Esploratore)
            currentStreak:
              type: integer
              minimum: 0
              description: Giorni consecutivi con almeno una quest completata
            longestStreak:
              type: integer
              minimum: 0
              description: Record personale di streak
            streakShieldActive:
              type: boolean
              description: Ha uno streak shield disponibile
            xpToNextLevel:
              type: integer
              nullable: true
              description: XP mancanti al prossimo livello, null se al livello massimo
            coins:
              type: integer
              minimum: 0
              description: Valuta spendibile nel mercato coupon
            onboardingCompleted:
              type: boolean
              description: Il player ha completato l'onboarding
            currentLeagueTier:
              $ref: '#/components/schemas/LeagueTier'
            oauthProvider:
              type: string
              nullable: true
              enum: [google, apple, null]
              description: Provider OAuth usato per la registrazione, null se email+password
    Admin:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [firstName, lastName]
          properties:
            firstName:
              type: string
            lastName:
              type: string
    RegisterPlayerRequest:
      type: object
      required: [email, password, username]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          format: password
        username:
          type: string
          minLength: 3
          maxLength: 30
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      description: |
        Risposta restituita da register e login. Contiene la coppia di token
        access+refresh e l'utente autenticato.
      required: [accessToken, refreshToken, accessExpiresIn, refreshExpiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT con TTL breve, da allegare alle richieste API
        refreshToken:
          type: string
          description: Token opaque con TTL lungo, da usare per rinnovare l'access
        accessExpiresIn:
          type: string
          example: 15m
        refreshExpiresIn:
          type: string
          example: 30d
        user:
          oneOf:
            - $ref: '#/components/schemas/Player'
            - $ref: '#/components/schemas/Admin'
          discriminator:
            propertyName: role
            mapping:
              player: '#/components/schemas/Player'
              admin: '#/components/schemas/Admin'
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    RefreshTokenResponse:
      type: object
      description: |
        Risposta dell'endpoint /auth/refresh. Contiene la nuova coppia di
        token. Il refresh token precedente viene revocato (rotation) e non
        e' piu' utilizzabile.
      required: [accessToken, refreshToken, accessExpiresIn, refreshExpiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessExpiresIn:
          type: string
          example: 15m
        refreshExpiresIn:
          type: string
          example: 30d
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    PasswordRecoveryRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    QuestType:
      type: string
      enum: [primary, secondary]
      description: |
        Tipo di quest:
        - primary: con QR code nascosto, sblocca un collezionabile
        - secondary: con check-in geolocalizzato, solo punti
    QuestStatus:
      type: string
      enum: [active, inactive, archived]
      description: Stato del ciclo di vita della quest.
    PlacementStatus:
      type: string
      enum: [pending, placed, reported]
      description: |
        Stato di piazzamento fisico del QR code di una quest principale:
        - pending: creata ma QR non ancora piazzato
        - placed: QR piazzato, posizione registrata
        - reported: QR segnalato come mancante o danneggiato
    CollectibleRarity:
      type: string
      enum: [common, uncommon, rare, legendary]
    CollectibleStatus:
      type: string
      enum: [active, archived]
      description: |
        Stato del ciclo di vita del collezionabile. Un collezionabile
        archiviato non e' assegnabile a nuove quest ma resta negli album
        dei giocatori che lo hanno gia' sbloccato.
    CreateCollectibleRequest:
      type: object
      required: [name, description, imageUrl, rarity]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 500
        imageUrl:
          type: string
          format: uri
        rarity:
          $ref: '#/components/schemas/CollectibleRarity'
        lore:
          type: string
          nullable: true
        coordinates:
          type: object
          nullable: true
          properties:
            lat: { type: number, format: double }
            lng: { type: number, format: double }
    UpdateCollectibleRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 500
        imageUrl:
          type: string
          format: uri
        rarity:
          $ref: '#/components/schemas/CollectibleRarity'
        lore:
          type: string
          nullable: true
        coordinates:
          type: object
          nullable: true
          properties:
            lat: { type: number, format: double }
            lng: { type: number, format: double }
    QuestBase:
      type: object
      description: Campi comuni a tutte le tipologie di quest.
      required: [id, name, description, type, status, basePoints, createdAt]
      properties:
        id:
          type: string
          example: 65f9a1b2c3d4e5f6a7b8c9d0
        name:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/QuestType'
        status:
          $ref: '#/components/schemas/QuestStatus'
        basePoints:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        _links:
          $ref: '#/components/schemas/Links'
    PrimaryQuest:
      allOf:
        - $ref: '#/components/schemas/QuestBase'
        - type: object
          required: [type, searchArea, searchRadiusMeters, collectibleId, placementStatus]
          properties:
            type:
              type: string
              enum: [primary]
            searchArea:
              $ref: '#/components/schemas/GeoPoint'
            searchRadiusMeters:
              type: integer
              minimum: 10
              maximum: 10000
            collectibleId:
              type: string
              nullable: true
            placementStatus:
              $ref: '#/components/schemas/PlacementStatus'
            qrToken:
              type: string
              nullable: true
    SecondaryQuest:
      allOf:
        - $ref: '#/components/schemas/QuestBase'
        - type: object
          required: [type, position, checkInRadiusMeters]
          properties:
            type:
              type: string
              enum: [secondary]
            position:
              $ref: '#/components/schemas/GeoPoint'
            checkInRadiusMeters:
              type: integer
              minimum: 5
              maximum: 500
    AnyQuest:
      oneOf:
        - $ref: '#/components/schemas/PrimaryQuest'
        - $ref: '#/components/schemas/SecondaryQuest'
      discriminator:
        propertyName: type
        mapping:
          primary: '#/components/schemas/PrimaryQuest'
          secondary: '#/components/schemas/SecondaryQuest'
    Collectible:
      type: object
      required: [id, name, description, imageUrl, rarity, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          format: uri
        rarity:
          $ref: '#/components/schemas/CollectibleRarity'
        status:
          $ref: '#/components/schemas/CollectibleStatus'
        lore:
          type: string
          nullable: true
          description: Testo narrativo per il retro della card del taccuino
        coordinates:
          type: object
          nullable: true
          description: Posizione geografica reale del luogo del collezionabile
          properties:
            lat:
              type: number
              format: double
              minimum: -90
              maximum: 90
            lng:
              type: number
              format: double
              minimum: -180
              maximum: 180
        createdAt:
          type: string
          format: date-time
        _links:
          $ref: '#/components/schemas/Links'
    CollectibleEntry:
      type: object
      required: [collectible, unlockedAt]
      properties:
        collectible:
          $ref: '#/components/schemas/Collectible'
        unlockedAt:
          type: string
          format: date-time
    Completion:
      type: object
      required: [id, questId, pointsAwarded, position, completedAt]
      properties:
        id:
          type: string
        questId:
          type: string
        pointsAwarded:
          type: integer
          minimum: 0
        position:
          $ref: '#/components/schemas/GeoPoint'
        completedAt:
          type: string
          format: date-time
    CompletionEntry:
      type: object
      required: [completion, quest]
      properties:
        completion:
          $ref: '#/components/schemas/Completion'
        quest:
          $ref: '#/components/schemas/AnyQuest'
    ProgressSummary:
      type: object
      required: [totalQuests, completedQuests, percentage]
      properties:
        totalQuests:
          type: integer
        completedQuests:
          type: integer
        percentage:
          type: number
          minimum: 0
          maximum: 100
    CheckInRequest:
      type: object
      required: [position]
      properties:
        position:
          $ref: '#/components/schemas/GeoPoint'
        fix:
          description: |
            Metadati di qualita' del fix GPS, opzionali per retrocompatibilita'.
            Se presenti, il server applica la validazione anti-cheat (rifiuto
            di fix imprecisi o vecchi). I client moderni dovrebbero sempre
            inviarli.
          type: object
          required: [accuracy, clientTimestamp]
          properties:
            accuracy:
              type: number
              format: double
              minimum: 0
              exclusiveMinimum: true
              maximum: 100000
            clientTimestamp:
              type: integer
              format: int64
              minimum: 1
    GamificationResult:
      type: object
      required: [xpAwarded, coinsAwarded, streakMultiplier, currentStreak, longestStreak, newLevel, levelTitle, totalXp, shieldEarned, shieldConsumed, streakBroken]
      properties:
        xpAwarded:
          type: integer
          minimum: 0
          description: XP assegnati per questo completamento (con moltiplicatore incluso)
        streakMultiplier:
          type: number
          format: double
          description: Moltiplicatore streak applicato (es. 1.25)
        currentStreak:
          type: integer
          minimum: 0
          description: Streak corrente dopo il completamento
        longestStreak:
          type: integer
          minimum: 0
          description: Record personale di streak
        newLevel:
          type: integer
          nullable: true
          description: Nuovo livello raggiunto con questo completamento, null se nessun level-up
        levelTitle:
          type: string
          description: Titolo del livello attuale dopo il completamento
        totalXp:
          type: integer
          minimum: 0
          description: XP totali dopo il completamento
        shieldEarned:
          type: boolean
          description: Ha guadagnato uno streak shield con questo completamento
        shieldConsumed:
          type: boolean
          description: Uno streak shield e' stato consumato (gap di inattivita' coperto)
        streakBroken:
          type: boolean
          description: La streak si e' azzerata (per info al client)
        coinsAwarded:
          type: integer
          minimum: 0
          description: Monete assegnate per questo completamento (10 secondary, 25 primary, moltiplicatore incluso)
    CheckInResponse:
      type: object
      required: [completion, pointsAwarded, totalPoints, distanceFromTargetMeters, gamification]
      properties:
        completion:
          $ref: '#/components/schemas/Completion'
        pointsAwarded:
          type: integer
        totalPoints:
          type: integer
        distanceFromTargetMeters:
          type: number
        gamification:
          $ref: '#/components/schemas/GamificationResult'
    ScanQrRequest:
      type: object
      required: [qrToken, position]
      properties:
        qrToken:
          type: string
        position:
          $ref: '#/components/schemas/GeoPoint'
        fix:
          description: |
            Metadati di qualita' del fix GPS, opzionali per retrocompatibilita'.
            Se presenti, il server applica la validazione anti-cheat (rifiuto
            di fix imprecisi o vecchi). Particolarmente rilevante per scansione
            QR: previene completamenti a distanza via condivisione del token
            (vedi UC-22.4 del Deliverable D1).
          type: object
          required: [accuracy, clientTimestamp]
          properties:
            accuracy:
              type: number
              format: double
              minimum: 0
              exclusiveMinimum: true
              maximum: 100000
            clientTimestamp:
              type: integer
              format: int64
              minimum: 1
    ScanQrResponse:
      type: object
      required: [completion, pointsAwarded, totalPoints, collectible, distanceFromTargetMeters, gamification]
      properties:
        completion:
          $ref: '#/components/schemas/Completion'
        pointsAwarded:
          type: integer
        totalPoints:
          type: integer
        collectible:
          $ref: '#/components/schemas/Collectible'
        distanceFromTargetMeters:
          type: number
        gamification:
          $ref: '#/components/schemas/GamificationResult'
    CreateSecondaryQuestRequest:
      type: object
      required: [type, name, description, basePoints, position, checkInRadiusMeters]
      properties:
        type:
          type: string
          enum: [secondary]
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        basePoints:
          type: integer
          minimum: 0
        position:
          $ref: '#/components/schemas/GeoPoint'
        checkInRadiusMeters:
          type: integer
          minimum: 5
          maximum: 500
    CreatePrimaryQuestRequest:
      type: object
      required: [type, name, description, basePoints, searchArea, searchRadiusMeters]
      properties:
        type:
          type: string
          enum: [primary]
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        basePoints:
          type: integer
          minimum: 0
        searchArea:
          $ref: '#/components/schemas/GeoPoint'
        searchRadiusMeters:
          type: integer
          minimum: 10
          maximum: 10000
        collectibleId:
          type: string
          nullable: true
    CreateQuestRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateSecondaryQuestRequest'
        - $ref: '#/components/schemas/CreatePrimaryQuestRequest'
      discriminator:
        propertyName: type
        mapping:
          secondary: '#/components/schemas/CreateSecondaryQuestRequest'
          primary: '#/components/schemas/CreatePrimaryQuestRequest'
    UpdateQuestRequest:
      type: object
      description: |
        Aggiornamento parziale di una quest. Almeno un campo deve essere
        fornito. I campi specifici di un tipo (searchArea/searchRadiusMeters/
        collectibleId per primary, position/checkInRadiusMeters per secondary)
        possono essere applicati solo a quest del tipo corretto.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        basePoints:
          type: integer
          minimum: 0
        searchArea:
          $ref: '#/components/schemas/GeoPoint'
        searchRadiusMeters:
          type: integer
          minimum: 10
          maximum: 10000
        collectibleId:
          type: string
          nullable: true
        position:
          $ref: '#/components/schemas/GeoPoint'
        checkInRadiusMeters:
          type: integer
          minimum: 5
          maximum: 500
    ListAdminQuestsResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AnyQuest'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    OperatorQuestView:
      type: object
      required:
        - id
        - name
        - description
        - status
        - basePoints
        - createdAt
        - type
        - searchArea
        - searchRadiusMeters
        - placementStatus
        - qrToken
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
